version: '3.8'

services:
  my-app:
    build: .
    container_name: my-python-app
    depends_on:
      - mysql-db

  mysql-db:
    image: mysql
    container_name: app-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1234
    volumes:
      - app-mysql-data:/var/lib/mysql

volumes:
  app-mysql-data:
